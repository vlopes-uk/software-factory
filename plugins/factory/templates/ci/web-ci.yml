# .github/workflows/ci.yml in the web repo (T-00-web installs this)
name: web-ci
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]
  release:
    types: [published]   # /factory:devops release -> deploy-prod (waits for the prod environment approval)
permissions:
  contents: read
  pull-requests: write   # SWA preview URL comment
  id-token: write
jobs:
  build-test:
    if: github.event.action != 'closed' && github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run contract:check      # fails if src/api/schema.d.ts is stale vs contracts/openapi.yaml
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run --coverage
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test         # runs against the vite preview server with MSW
      - run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist }
  deploy:
    needs: build-test
    if: github.event.action != 'closed' && github.event_name != 'release'
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'dev' || 'preview' }}
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_DEPLOYMENT_TOKEN }}   # or OIDC once supported for your setup
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist
          skip_app_build: true
  close-preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_DEPLOYMENT_TOKEN }}
          action: close
  deploy-prod:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: prod        # required reviewer = the human
    steps:
      - uses: actions/checkout@v4
        with: { ref: ${{ github.event.release.tag_name }} }
      - uses: actions/setup-node@v4
        with: { node-version: lts/*, cache: npm }
      - run: npm ci && npm run build
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_DEPLOYMENT_TOKEN_PROD }}
          action: upload
          app_location: dist
          skip_app_build: true
